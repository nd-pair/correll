<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Art — Nikolaus Correll</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header id="site-nav"></header>

<div class="hero sub">
  <div class="wrap">
    <p class="eyebrow">Swarms · sound · kinetic sculpture</p>
    <h1>Art</h1>
    <p class="role" id="art-intro" style="max-width:76ch">Loading…</p>
  </div>
</div>

<section>
  <div class="wrap" id="art-root"></div>
</section>

<footer id="site-footer"></footer>
<script src="site.js"></script>
<script>
const esc = s => String(s==null?"":s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const yt = id => `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}`;
fetch("data/art.json").then(r=>r.json()).then(data=>{
  document.getElementById("art-intro").textContent = data.intro || "";
  document.getElementById("art-root").innerHTML = (data.works||[]).map(w=>`
    <div class="art-item">
      <h3>${esc(w.title)}<span class="yr">${esc(w.year||"")}</span></h3>
      ${(w.body||[]).map(p=>`<p>${esc(p)}</p>`).join("")}
      ${w.image?`<img class="art-img" loading="lazy" src="${esc(w.image)}" alt="${esc(w.title)}">`:""}
      ${w.video?`<div class="embed"><iframe src="${yt(w.video)}" title="${esc(w.title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`:""}
      ${w.links&&w.links.length?`<div class="cta" style="margin-top:12px">${w.links.map(l=>`<a class="btn ghost" style="border-color:var(--line);color:var(--indigo-2)" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>`:""}
      ${w.watch&&w.watch.length?`<p class="ref">Referenced: ${w.watch.map(v=>`<a href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">${esc(v.label)}</a>`).join(" · ")}</p>`:""}
      ${w.refs&&w.refs.length?`<div class="ref">${w.refs.map(r=>esc(r)).join("<br>")}</div>`:""}
    </div>`).join("");
});
</script>
</body>
</html>
