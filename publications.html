<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Publications — Correll Lab</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header id="site-nav"></header>

<div class="hero" style="padding-bottom:20px">
  <div class="wrap">
    <p class="eyebrow">Correll Lab</p>
    <h1>Publications</h1>
    <p class="role" id="pub-sub">Loading…</p>
  </div>
</div>

<div class="pubbar">
  <div class="wrap"><input id="q" type="search" placeholder="Search by title, author, venue, or year…" autocomplete="off" /></div>
</div>

<section style="padding-top:6px">
  <div class="wrap" id="pub-root"></div>
</section>

<footer id="site-footer"></footer>
<script src="site.js"></script>
<script>
const esc = s => String(s==null?"":s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ME = /correll/i;
function authorList(a){
  if(!a||!a.length) return "";
  const names = a.map(n => ME.test(n) ? `<span class="au">${esc(n)}</span>` : esc(n));
  if(names.length>8) return names.slice(0,8).join(", ") + ` <span class="more">…+${names.length-8} more</span>`;
  return names.join(", ");
}
function pubHTML(w){
  const link = w.doi || w.id;
  const t = link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(w.title)}</a>` : esc(w.title);
  const meta = [w.venue, w.year].filter(Boolean).map(esc).join(" · ");
  return `<div class="pub" data-s="${esc((w.title+" "+(w.authors||[]).join(" ")+" "+(w.venue||"")+" "+(w.year||"")).toLowerCase())}">
    <div class="t">${t}</div>
    <div class="m">${authorList(w.authors)}</div>
    ${meta?`<div class="m">${meta}</div>`:""}
  </div>`;
}
let YEARS=[];
fetch("data/publications.json").then(r=>r.json()).then(data=>{
  YEARS = data.years||[];
  document.getElementById("pub-sub").textContent =
    `${data.total} publications · ${YEARS.length} years · via ${data.source||"OpenAlex"}`;
  render();
});
function render(){
  const root = document.getElementById("pub-root");
  root.innerHTML = YEARS.map(g=>`<div class="yeargroup" data-year="${g.year||""}">
    <h2>${g.year||"Other"} <span class="c">${g.count}</span></h2>
    ${g.items.map(pubHTML).join("")}
  </div>`).join("");
}
document.getElementById("q").addEventListener("input", e=>{
  const q = e.target.value.trim().toLowerCase();
  let shownYears=0;
  document.querySelectorAll(".yeargroup").forEach(yg=>{
    let n=0;
    yg.querySelectorAll(".pub").forEach(p=>{
      const hit = !q || p.dataset.s.includes(q);
      p.style.display = hit?"":"none"; if(hit) n++;
    });
    yg.style.display = n?"":"none"; if(n) shownYears++;
  });
});
</script>
</body>
</html>
