name: Refresh publications & thumbnails
on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      refresh_figures:
        description: "Re-extract & LLM-re-pick every figure (ignore the cache) — one-time backlog cleanup"
        type: boolean
        default: false
permissions:
  contents: write   # commit refreshed data
  pages: write      # deploy the result (a GITHUB_TOKEN push does not trigger deploy.yml)
  id-token: write
  issues: write     # raise one when an unattended refresh introduces a problem
concurrency:
  group: pages          # shares the deploy workflow's group so they never collide
  cancel-in-progress: false
jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a shallow clone cannot rebase onto the updated branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow pymupdf anthropic
          python -m playwright install --with-deps chromium
          npm install --no-save --no-audit --no-fund playwright axe-core
          npx playwright install chromium
      - name: Pull publications from OpenAlex
        env:
          OPENALEX_MAILTO: ncorrell@nd.edu
        run: python3 scripts/pull_pubs.py
      - name: Extract curated thumbnails from the lab site
        run: python3 scripts/pull_pub_images.py
      # The next two steps use Claude (Anthropic API) when ANTHROPIC_API_KEY is set as a
      # repo secret; without it they no-op and the site keeps heuristic figures / no teasers.
      - name: Auto-extract & LLM-select figures from open-access PDFs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/pull_pub_figures.py ${{ github.event.inputs.refresh_figures == 'true' && '--refresh' || '' }}
      - name: Fetch poster frames for the embedded videos
        run: python3 scripts/pull_video_thumbs.py
      - name: Generate teaser lines from abstracts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/pull_pub_teasers.py
      - name: Rebuild the pages from the refreshed data
        run: python3 scripts/build_site.py

      # Nobody is watching a Monday-morning cron, so this advises rather than
      # blocks: a site that stops updating because an author's name tripped a
      # contrast rule is worse than one that updates and files a ticket.
      - name: Stage the site for checking
        run: |
          mkdir -p _site
          cp *.html styles.css app.js robots.txt sitemap.xml CNAME _site/
          cp -r assets _site/
      - name: Accessibility and design check (advisory)
        # GITHUB_TOKEN lets the checker file what it finds as an issue, so a
        # warning nobody read still reaches someone.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/a11y_check.js --root _site --warn-only
      # Restored: an earlier edit of this file removed this step, so the weekly
      # refresh was crawling, rebuilding and deploying without ever committing the
      # refreshed data back — every run started from the same stale baseline.
      - name: Commit and push the refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data assets/pubs assets/video *.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-refresh publications and thumbnails"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "::error::Refresh conflicts with $GITHUB_REF_NAME. Re-run this workflow."
              exit 1
            fi
            python3 scripts/build_site.py
            git add -A
            git diff --cached --quiet || git commit --amend --no-edit
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); someone pushed while we ran — retrying"
            sleep 5
          done
          echo "::error::Could not push the refresh after three attempts."
          exit 1
      # Deploy Pages directly — a push made with GITHUB_TOKEN does not trigger deploy.yml,
      # so this workflow publishes the refreshed content itself.
      - uses: actions/configure-pages@v5
      - name: Stage the publishable site
        run: |
          mkdir -p _site
          cp *.html styles.css app.js robots.txt sitemap.xml CNAME _site/
          cp -r assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
