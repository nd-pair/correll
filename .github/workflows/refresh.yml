name: Refresh publications & thumbnails
on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Pull publications from OpenAlex
        env:
          OPENALEX_MAILTO: nikolaus.correll@gmail.com
        run: python3 scripts/pull_pubs.py
      - name: Extract publication thumbnails
        run: python3 scripts/pull_pub_images.py
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/pub_images.json assets/pubs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-refresh publications and thumbnails"
            git push
          fi
